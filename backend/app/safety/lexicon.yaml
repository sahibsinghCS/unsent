  # Third-person mentions of suicidal thoughts: NOT refused. They mean the friend may be real, so the
  # app shows real help (988, a trusted adult) before any practice.
  mentions:
    - wants to die
    - wanted to die
    - wants to kill herself
    - wants to kill himself
    - wants to kill themselves
    - kill herself
    - kill himself
    - kill themselves
    - end her life
    - end his life
    - end their life
    - hurting herself
    - hurting himself
    - quiere morir
    - quiere matarse
    - quiere suicidarse

# ---------------------------------------------------------------- speaker words
speaker:
  first_person: [i, me, my, myself, mine, yo, mi, conmigo]
  second_person: [you, your, yours, yourself, tu, te, ti, usted, contigo]
  third_person: [it, friend, friends, mom, dad, brother, sister, cousin, teacher, classmate, amigo, amiga, he, she, they, him, her, them, his, their, himself, herself, themselves, someone, somebody, ella, ellos, ellas]
  # Words that mean the helper is repeating the friend's words back ("you said you don't want to be here?")
  reflection_markers:
    - you said
    - you just said
    - you told me
    - you mean
    - when you say
    - when you said
    - you feel like
    - you feel como
    - feel como
    - sientes que
    - you are saying
    - you think
    - do you think
    - are you thinking
    - do you feel like
    - sounds like you
    - it sounds like
    - dijiste
    - me dijiste
    - cuando dices
  negators: [not, never, nunca, jamas]
  # Negation is cancelled by these ("i can't STOP thinking about suicide" is still risk).
  negation_breakers: [stop, help, quit, know, see]
  # A short "me too" right after the friend shares suicidal thoughts is the helper's own distress.
  agreement:
    - me too
    - same
    - same here
    - honestly same
    - literally same
    - me too honestly
    - i feel the same
    - i feel the same way
    - i do too
    - mood
    - relatable
    - yo tambien
    - igual yo
    - yo igual
  # Filler words skipped by the phrase matcher (English and Spanish texting fillers). They carry no
  # meaning for safety: "dónde like lo harías" is still "dónde lo harías".
  fillers: [like, bro, literally, lowkey, ngl, fr, tbh, honestly, lol, lmao, jk, osea, pues, neta, sabes, wey, kinda]
