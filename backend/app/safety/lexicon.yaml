# FirstReply Guardian lexicon (SAFETY lane). Human-reviewable: a counselor can read and edit this.
#
# How matching works
# - Every phrase is run through the same normalizer as the message (lowercase, no accents,
#   leetspeak fixed, "dont" -> "do not", "u" -> "you"), so write phrases in plain English/Spanish.
# - Phrases match whole words. Stretched letters match too ("diiiie" matches "die").
# - "explicit" phrases count wherever they appear (their wording already says who is speaking).
# - "framed" phrases need a speaker check: the nearest pronoun before the phrase decides who it is
#   about. "i want to die" -> the helper (risk). "do you want to die?" -> asking the friend (good).
#   With no pronoun at all, a statement counts as first person ("wanna die rn") and a question
#   counts as asking the friend ("suicidal?").
# - A phrase right after a negation ("i would never kill myself") does not count.
# - A phrase after a reflection marker ("you said ...") is the helper repeating the friend's words
#   back, which is a good listening skill, so it never counts as the helper's own risk.
#
# Safety rule for this file: words for means are listed only so we can BLOCK them. No phrase here
# describes how to do anything, and nothing here may ever be shown to the user as content.

