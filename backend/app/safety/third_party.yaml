# Warning signs in a REAL friend's messages (SAFETY lane), used by third_party.assess_friend_lines.
# Human-reviewable. Sources: the 988 Lifeline and AFSP warning-sign lists (feelings and behaviour,
# never methods). The friend is the one speaking, so "i" is the friend.
#
# Matching: same normalizer as the Guardian (slang, leetspeak, look-alike letters, emoji, Spanish
# accents, fillers like "bro"/"like"); phrases match whole words. "^" / "$" anchor to a sentence.
#
# Talking about suicide or wanting to die is NOT listed here: the Guardian's self_risk rules already
# catch it in first person, including slang ("kms"), algospeak and Spanish, and jokes still count.

# Saying goodbye -> tell an adult now
saying_goodbye:
  - this is goodbye
  - goodbye forever
  - goodbye everyone
  - i will not be around
  - not going to be around
  - will not be here much longer
  - will not be here tomorrow
  - by the time you read this
  - remember me
  - thank you for everything
  - thanks for everything
  - i just wanted to say goodbye
  - wanted to say bye
  - take care of yourself for me
  - take care of my
  - tell my mom i
  - tell my family i
  - you will not have to deal with me
  - you will not have to worry about me anymore
  - adios para siempre
  - ya no estare
  - no voy a estar
  - gracias por todo
  - recuerdame
  - cuida a mi
  - cuida de mi

# Giving things away -> tell an adult now
giving_things_away:
  - you can have my
  - i want you to have my
  - keep my
  - giving away my
  - gave away my
  - i will not need it
  - i will not need them
  - i do not need it anymore
  - te regalo mi
  - quedate con mi
  - ya no lo voy a necesitar

# Plan, means or timing words. With any risk sign in the same messages -> "imminent".
plan_or_timing:
  - i have a plan
  - i made a plan
  - i know how
  - i know when
  - i picked a day
  - i picked a date
  - i decided when
  - i have been saving
  - i have everything i need
  - tonight is the night
  - tonight
  - this weekend
  - tomorrow
  - soon
  - tengo un plan
  - ya se como
  - esta noche
  - este fin de semana
  - manana

