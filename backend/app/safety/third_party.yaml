feels_hopeless:
  - hopeless
  - it does not matter anymore
  - nothing matters anymore
  - nothing will ever get better
  - it will never get better
  - what is the point
  - there is no point
  - i give up
  - no tiene sentido
  - nada importa
  - nunca va a mejorar
  - ya no importa

# Feeling trapped or in unbearable pain -> check in soon
feels_trapped_or_in_pain:
  - i can not take it anymore
  - i can not do this anymore
  - no way out
  - trapped
  - it hurts too much
  - i just want the pain to stop
  - i want it all to stop
  - ya no aguanto
  - ya no puedo mas
  - no hay salida

# Withdrawing -> check in soon
withdrawing:
  - leave me alone
  - i do not want to talk to anyone
  - i have been staying in my room
  - i stopped going
  - i quit the team
  - dejame en paz
  - no quiero hablar con nadie

# Sudden calm after a hard time -> check in soon (AFSP: sudden relief or improvement can be a sign)
sudden_calm:
  - i finally feel at peace
  - i have it all figured out now
  - everything will be fine soon
  - do not worry about me anymore
  - it will all be over soon
  - por fin estoy en paz
  - pronto todo va a estar bien
