<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Unsent: practice the text that could save a friend's life." />
    <meta name="theme-color" content="#F2F2F7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Unsent</title>
    <script>
      // Apply the saved (or system) theme before first paint so dark mode never flashes white.
      try {
        var t = localStorage.getItem('fr.theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
